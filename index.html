<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Probit BD - Grow Together</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f8f6;
    color: #26352e;
}

header {
    background: white;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 10px #00000010;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #138b72;
}

.logo span {
    color: #26352e;
}

nav {
    background: #138b72;
    padding: 13px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 10px;
    font-weight: bold;
}

button {
    border: none;
    border-radius: 7px;
    padding: 11px 16px;
    background: #138b72;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #08745d;
}

.language {
    background: #26352e;
}

.hero {
    text-align: center;
    padding: 55px 20px;
    background: linear-gradient(135deg,#e3f7ef,#ffffff);
}

.hero h1 {
    color: #138b72;
    font-size: 32px;
    margin-bottom: 15px;
}

.hero p {
    line-height: 1.8;
    margin-bottom: 20px;
}

.container {
    max-width: 600px;
    margin: 25px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 3px 15px #00000010;
    margin-bottom: 20px;
}

h2 {
    color: #138b72;
    margin-bottom: 18px;
    text-align: center;
}

input {
    width: 100%;
    padding: 13px;
    margin: 9px 0;
    border: 1px solid #ddd;
    border-radius: 7px;
    font-size: 15px;
}

.full {
    width: 100%;
    margin-top: 10px;
}

.hidden {
    display: none;
}

.link {
    color: #138b72;
    cursor: pointer;
    font-weight: bold;
}

.features {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
}

.feature {
    background: white;
    padding: 20px 10px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 2px 8px #00000008;
}

footer {
    background: #26352e;
    color: white;
    text-align: center;
    padding: 22px;
    margin-top: 35px;
}

@media(max-width:400px) {
    .hero h1 {
        font-size: 25px;
    }

    nav a {
        margin: 0 5px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<header>

    <button class="language" onclick="changeLanguage()" id="langBtn">
        English
    </button>
</header>

    <a href="#" onclick="showSignup()" data-bn="রেজিস্টার" data-en="Register">রেজিস্টার</a>
</nav>

        </div>
    </div>
</section>
